# docker-compose.yml — Hermes with JLCPCB auth plugin
#
# Credentials are injected from a secrets file that lives ONLY on the VPS.
# They are never in this file, never in the Docker image, never in git.
#
# Setup (run once on VPS):
#   sudo mkdir -p /etc/hermes
#   sudo nano /etc/hermes/secrets.env      # paste the two lines below
#   sudo chmod 600 /etc/hermes/secrets.env
#   sudo chown root:root /etc/hermes/secrets.env
#
# Contents of /etc/hermes/secrets.env:
#   JLCPCB_USERNAME=your@email.com
#   JLCPCB_PASSWORD=yourpassword
#
# Then start:
#   docker compose up -d

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped

    # ── Inject secrets from a file that never enters the image ────────────────
    env_file:
      - /etc/hermes/secrets.env           # ← only exists on the VPS

    # ── Mount the plugin into the container ───────────────────────────────────
    volumes:
      - hermes-data:/root/.hermes          # persistent Hermes config + sessions
      - ./jlcpcb-auth:/root/.hermes/plugins/jlcpcb-auth:ro  # plugin (read-only)

    # ── Dashboard port (bind to localhost only — use SSH tunnel to access) ────
    ports:
      - "127.0.0.1:9119:9119"             # dashboard: ssh -L 9119:localhost:9119 user@vps

    # ── Other Hermes env vars (non-secret) ────────────────────────────────────
    environment:
      - HERMES_DASHBOARD_TUI=0            # disable embedded TUI in dashboard
      # Add your LLM API key here or in secrets.env:
      # - ANTHROPIC_API_KEY=sk-...

volumes:
  hermes-data:
