name: jlcpcb-auth
version: 1.3.0
description: >
  Secure JLCPCB authentication plugin.
  Logs the agent into passport.jlcpcb.com without ever exposing credentials
  to the model's context window. Credentials can be configured at runtime
  from the dashboard tab or by setting environment variables.
author: Liam / modelrailway3d.co.uk

provides_tools:
  - jlcpcb_login
  - jlcpcb_logout
  - jlcpcb_auth_status

provides_hooks:
  - post_tool_call
